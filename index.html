<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Waifu AI</title>
<style>
:root{--bg:#f3eefe;--panel:#fff;--ink:#241b3d;--sub:#7a6f99;--pink:#ff7fa8;--lav:#8f7bff;--line:#e2daf7;--me:#8f7bff;--meink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#171230;--panel:#251d47;--ink:#f1ecff;--sub:#a99fd0;--line:#382e66}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.45 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:14px;padding:14px 16px 10px}
.stage{position:relative;width:84px;height:84px;flex:none}
.stage svg{position:absolute;inset:0;transform:rotate(-90deg)}
.stage circle{fill:none;stroke-width:5;stroke-linecap:round}
.rt{stroke:var(--line)}.rf{stroke:var(--pink);stroke-dasharray:226.2;stroke-dashoffset:226.2;transition:stroke-dashoffset .8s}
#face{position:absolute;inset:9px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:38px}
.hd{flex:1;min-width:0}
.hd b{font-size:20px;display:block}
.hd small{color:var(--sub)}
header button{background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:20px;width:44px;height:44px;color:var(--ink)}
#log{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.b{max-width:82%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word}
.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.me{align-self:flex-end;background:var(--me);color:var(--meink);border-bottom-right-radius:5px}
.err{color:#d6335f}
footer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
textarea,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
#in{resize:none;max-height:120px}
#go,.pri{background:var(--pink);color:#fff;border:0;border-radius:14px;padding:0 18px;font:inherit;font-weight:700;min-height:44px}
dialog{width:min(92vw,460px);border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:18px}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 10px}
label{display:block;margin:10px 0 4px;color:var(--sub);font-size:14px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;min-height:44px}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
a{color:var(--lav)}
</style>
</head>
<body>
<header>
  <div class="stage">
    <svg viewBox="0 0 84 84"><circle class="rt" cx="42" cy="42" r="36"/><circle class="rf" id="ring" cx="42" cy="42" r="36"/></svg>
    <div id="face">🙂</div><!-- Live2D sau này sẽ thay vào đây -->
  </div>
  <div class="hd"><b id="nm"></b><small id="lv"></small></div>
  <button id="bM" aria-label="Trí nhớ">🧠</button>
  <button id="bS" aria-label="Cài đặt">⚙️</button>
</header>
<main id="log"></main>
<footer>
  <textarea id="in" rows="1" placeholder="Nhắn gì đó..."></textarea>
  <button id="go">Gửi</button>
</footer>

<dialog id="dS">
  <h3>Cài đặt</h3>
  <label>Gemini API key (miễn phí tại <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com</a>)</label>
  <input id="c_key" type="password" autocomplete="off">
  <label>Tên model</label><input id="c_model">
  <label>Tên nhân vật</label><input id="c_name">
  <label>Tên của bạn</label><input id="c_user">
  <label>Tính cách</label><textarea id="c_persona" rows="3"></textarea>
  <div class="row"><button class="pri" id="sS">Lưu</button><button class="sec" onclick="$('#dS').close()">Đóng</button></div>
</dialog>

<dialog id="dM">
  <h3>Trí nhớ</h3>
  <label>Điều đã biết về bạn (mỗi dòng một mục, sửa thoải mái)</label>
  <textarea id="m_f" rows="6"></textarea>
  <label>Tóm tắt mối quan hệ</label>
  <textarea id="m_s" rows="3"></textarea>
  <div class="row">
    <button class="pri" id="sM">Lưu</button>
    <button class="sec" id="xp">Xuất file</button>
    <button class="sec" onclick="$('#im').click()">Nhập file</button>
    <button class="sec" id="rs">Xóa hết</button>
    <button class="sec" onclick="$('#dM').close()">Đóng</button>
  </div>
  <input id="im" type="file" accept="application/json" hidden>
</dialog>

<script>
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};

let cfg=Object.assign({key:'',model:'gemini-2.5-flash',name:'Aiko',user:'',persona:'Dịu dàng, hơi tsundere, hay quan tâm nhưng ngại thể hiện.'},ld('cfg',{}));
let mem=Object.assign({facts:[],summary:'',aff:0,n:0},ld('mem',{}));
let chat=ld('chat',[]);
let busy=false;

const MOODS={happy:'😊',shy:'😳',sad:'😢',angry:'😤',surprised:'😲',neutral:'🙂'};
const LV=[[0,'Người lạ'],[20,'Quen biết'],[60,'Bạn bè'],[120,'Thân thiết'],[250,'Người đặc biệt']];

function lvl(){let i=0;LV.forEach((l,j)=>{if(mem.aff>=l[0])i=j});const nx=LV[i+1];return{name:LV[i][1],pct:nx?(mem.aff-LV[i][0])/(nx[0]-LV[i][0]):1}}
// Điểm móc nối Live2D: sau này chỉ cần thay thân hàm này
window.setExpression=m=>{$('#face').textContent=MOODS[m]||MOODS.neutral};
function ui(){const l=lvl();$('#nm').textContent=cfg.name;$('#lv').textContent=l.name+' · '+mem.aff+' điểm';$('#ring').style.strokeDashoffset=226.2*(1-l.pct)}
function bub(role,text){const d=document.createElement('div');d.className='b '+role;d.textContent=text;$('#log').append(d);$('#log').scrollTop=1e9;return d}

const sys=()=>`Bạn là ${cfg.name}, một cô gái đang nhắn tin với ${cfg.user||'người dùng'}. Tính cách: ${cfg.persona}
Mức thân thiết hiện tại: ${lvl().name}. Hãy cư xử đúng mức đó: còn xa lạ thì lịch sự và giữ khoảng cách, càng thân thì càng gần gũi, tự nhiên.
Điều đã biết về người dùng: ${mem.facts.join('; ')||'chưa có gì'}.
Tóm tắt các cuộc trò chuyện trước: ${mem.summary||'chưa có'}.
Trả lời bằng tiếng Việt, 1-3 câu như nhắn tin, không tự nhận là AI. Luôn mở đầu bằng một thẻ cảm xúc: [mood:happy], [mood:shy], [mood:sad], [mood:angry], [mood:surprised] hoặc [mood:neutral].`;

async function gem(contents,system,retry=1){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${cfg.model}:generateContent`,{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},
    body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents,...(/^gemini-3/.test(cfg.model)?{generationConfig:{thinkingConfig:{thinkingLevel:'low'}}}:{})}),
    signal:AbortSignal.timeout(60000)
  });
  const j=await r.json();
  if((r.status===503||r.status===429)&&retry){await new Promise(s=>setTimeout(s,2500));return gem(contents,system,retry-1)}
  if(!r.ok)throw new Error(j.error?.message||r.status);
  return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
}

async function send(){
  const t=$('#in').value.trim();
  if(!t||busy)return;
  if(!cfg.key){$('#bS').click();return}
  busy=true;$('#in').value='';
  chat.push({r:'user',t});bub('me',t);
  const w=bub('ai','…');
  try{
    const h=chat.slice(-20).map(m=>({role:m.r==='user'?'user':'model',parts:[{text:m.t}]}));
    while(h.length&&h[0].role==='model')h.shift();
    let o=await gem(h,sys());
    const m=o.match(/\[mood:(\w+)\]/);
    o=o.replace(/\[mood:\w+\]\s*/g,'').trim();
    setExpression(m&&m[1]);
    w.textContent=o;chat.push({r:'model',t:o});
    mem.aff++;mem.n++;
    if(mem.n%6===0)consolidate();
  }catch(e){
    w.textContent='Không gửi được: '+(e.name==='TimeoutError'?'chờ quá lâu, mạng hoặc Google đang chậm, thử gửi lại nhé':e.message+'. Kiểm tra API key và tên model trong Cài đặt')+'.';
    w.classList.add('err');chat.pop();
  }
  chat=chat.slice(-200);sv('chat',chat);sv('mem',mem);ui();busy=false;
}

// Cứ 6 tin nhắn, nhờ AI cập nhật hồ sơ ghi nhớ (tiết kiệm lượt gọi API miễn phí)
async function consolidate(){
  try{
    const p=`Hồ sơ hiện tại về người dùng: ${JSON.stringify({facts:mem.facts,summary:mem.summary})}
Đoạn chat gần đây:
${chat.slice(-12).map(m=>(m.r==='user'?'Người dùng':cfg.name)+': '+m.t).join('\n')}
Cập nhật hồ sơ: giữ các sự thật bền vững về người dùng (tên, sở thích, gia đình, công việc, mục tiêu...), tối đa 30 mục ngắn gọn, bỏ trùng lặp. summary tối đa 600 ký tự về mối quan hệ và những chuyện đã xảy ra. Chỉ trả JSON dạng {"facts":["..."],"summary":"..."}`;
    const o=await gem([{role:'user',parts:[{text:p}]}],'Bạn là bộ máy ghi nhớ. Chỉ trả JSON thuần, không giải thích.');
    const j=JSON.parse(o.replace(/```json|```/g,'').trim());
    if(Array.isArray(j.facts)){mem.facts=j.facts.slice(0,30).map(String);mem.summary=String(j.summary||'');sv('mem',mem)}
  }catch{}
}

const F=['key','model','name','user','persona'];
$('#bS').onclick=()=>{F.forEach(k=>$('#c_'+k).value=cfg[k]);$('#dS').showModal()};
$('#sS').onclick=()=>{F.forEach(k=>cfg[k]=$('#c_'+k).value.trim());sv('cfg',cfg);ui();$('#dS').close()};
$('#bM').onclick=()=>{$('#m_f').value=mem.facts.join('\n');$('#m_s').value=mem.summary;$('#dM').showModal()};
$('#sM').onclick=()=>{mem.facts=$('#m_f').value.split('\n').map(s=>s.trim()).filter(Boolean);mem.summary=$('#m_s').value.trim();sv('mem',mem);$('#dM').close()};
$('#xp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({cfg:{...cfg,key:''},mem,chat})],{type:'application/json'}));a.download='waifu-backup.json';a.click()};
$('#im').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(j.mem)sv('mem',j.mem);if(j.chat)sv('chat',j.chat);if(j.cfg)sv('cfg',{...cfg,...j.cfg,key:cfg.key});location.reload()}catch{alert('File không hợp lệ')}};
$('#rs').onclick=()=>{if(confirm('Xóa toàn bộ trí nhớ và lịch sử chat?')){localStorage.removeItem('mem');localStorage.removeItem('chat');location.reload()}};
$('#go').onclick=send;
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!('ontouchstart' in window)){e.preventDefault();send()}});

chat.forEach(m=>bub(m.r==='user'?'me':'ai',m.t));
if(!chat.length)bub('ai',cfg.key?'Chào cậu, mình là '+cfg.name+'. Nói chuyện với mình nhé?':'Chào cậu! Bấm ⚙️ để dán API key trước khi mình trò chuyện nhé.');
ui();
</script>
</body>
</html>
